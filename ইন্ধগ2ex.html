<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duty Tracker Pro - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #050505; --surface: #121212; --card: #1e1e1e;
            --text: #ffffff; --text-sub: #a0a0a0;
            --primary: #4361ee; --primary-light: #6c8cff;
            --secondary: #4cc9f0; --accent: #f72585;
            --success: #06d6a0; --danger: #ef233c;
            --border: rgba(255,255,255,0.12); --input: #2a2a2a;
            --gradient: linear-gradient(135deg, #4361ee, #4cc9f0);
            --shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }

        @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        @keyframes zoomIn { from{opacity:0;transform:scale(0.85)} to{opacity:1;transform:scale(1)} }
        @keyframes spin { to{transform:rotate(360deg)} }

        /* SPLASH */
        #splash { position:fixed; inset:0; background:linear-gradient(135deg,#020024,#090979,#00d4ff); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; transition:opacity 0.8s; }
        .splash-logo { font-size:70px; color:white; margin-bottom:20px; animation:zoomIn 0.8s; }
        .loader { width:45px; height:45px; border:4px solid rgba(255,255,255,0.2); border-top-color:white; border-radius:50%; animation:spin 1s linear infinite; margin:25px 0; }

        /* AUTH CARD */
        .auth-container { width:100%; max-width:420px; animation:fadeIn 0.4s ease-out; }
        .logo-area { text-align:center; margin-bottom:30px; }
        .logo-icon { font-size:50px; background:var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .logo-text { font-size:26px; font-weight:800; background:var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-top:8px; }
        .logo-sub { font-size:13px; color:var(--text-sub); margin-top:4px; }

        .auth-card { background:var(--card); border-radius:28px; padding:30px 25px; border:1px solid var(--border); box-shadow:var(--shadow); }
        .tab-row { display:flex; background:var(--input); border-radius:14px; padding:4px; margin-bottom:25px; }
        .tab-btn { flex:1; padding:10px; border:none; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer; transition:0.3s; background:transparent; color:var(--text-sub); }
        .tab-btn.active { background:var(--gradient); color:white; box-shadow:0 4px 15px rgba(67,97,238,0.3); }

        .form-section { display:none; }
        .form-section.active { display:block; animation:fadeIn 0.3s; }

        .inp-wrap { position:relative; margin-bottom:15px; }
        .inp-icon { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--text-sub); font-size:16px; }
        .inp { width:100%; padding:15px 15px 15px 44px; background:var(--input); border:1px solid var(--border); color:var(--text); border-radius:14px; outline:none; font-size:15px; transition:0.3s; font-family:'Outfit',sans-serif; }
        .inp:focus { border-color:var(--primary); background:rgba(67,97,238,0.05); }
        .eye-btn { position:absolute; right:16px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-sub); cursor:pointer; font-size:16px; }

        .btn { width:100%; padding:16px; border:none; border-radius:16px; font-weight:700; cursor:pointer; display:flex; justify-content:center; align-items:center; gap:10px; transition:all 0.2s; font-size:16px; font-family:'Outfit',sans-serif; }
        .btn-primary { background:var(--gradient); color:white; box-shadow:0 8px 25px rgba(67,97,238,0.3); }
        .btn-primary:active { transform:scale(0.97); }
        .btn-google { background:white; color:#333; border:1px solid #ddd; margin-top:12px; }
        .btn-google:active { transform:scale(0.97); background:#f5f5f5; }
        .google-icon { width:20px; height:20px; }

        .divider { display:flex; align-items:center; gap:12px; margin:18px 0; }
        .divider-line { flex:1; height:1px; background:var(--border); }
        .divider span { font-size:12px; color:var(--text-sub); font-weight:500; }

        .forgot-link { text-align:right; margin-bottom:16px; }
        .forgot-link a { font-size:13px; color:var(--primary-light); text-decoration:none; font-weight:600; }

        .terms-text { font-size:11px; color:var(--text-sub); text-align:center; margin-top:16px; line-height:1.6; }
        .terms-text a { color:var(--primary-light); text-decoration:none; }

        /* FORGOT PASSWORD PANEL */
        #forgot-panel { display:none; animation:fadeIn 0.3s; }
        .back-btn { background:none; border:none; color:var(--primary-light); font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; margin-bottom:20px; font-family:'Outfit',sans-serif; }

        /* TOAST */
        #toast { visibility:hidden; min-width:240px; background:#1e1e1e; color:#fff; border:1px solid var(--border); text-align:center; border-radius:50px; padding:14px 20px; position:fixed; z-index:12000; left:50%; bottom:40px; transform:translateX(-50%); font-size:14px; opacity:0; transition:opacity 0.3s,bottom 0.3s; box-shadow:0 8px 25px rgba(0,0,0,0.5); }
        #toast.show { visibility:visible; opacity:1; bottom:60px; }
        #toast.success { border-color:var(--success); }
        #toast.error { border-color:var(--danger); }

        /* LOADING OVERLAY */
        #loading { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:8000; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
        .loading-box { background:var(--card); padding:30px; border-radius:20px; text-align:center; border:1px solid var(--border); }
        .loading-box .loader { margin:0 auto 15px; }

        .strength-bar { height:4px; border-radius:4px; margin-top:-10px; margin-bottom:12px; background:var(--input); overflow:hidden; }
        .strength-fill { height:100%; border-radius:4px; transition:0.3s; }

        .made-in { text-align:center; margin-top:20px; font-size:12px; color:var(--text-sub); }
    </style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
    <i class="fas fa-shield-alt splash-logo"></i>
    <h1 style="color:white;font-weight:300;">Duty Tracker <b style="font-weight:800;">Pro</b></h1>
    <div class="loader"></div>
    <div style="background:rgba(255,255,255,0.1);padding:8px 16px;border-radius:20px;color:#ccc;font-size:12px;">Made in India 🇮🇳</div>
    <div style="position:absolute;bottom:25px;color:#aaa;font-size:12px;">Developer By <b>Nitai Studio</b></div>
</div>

<!-- LOADING OVERLAY -->
<div id="loading">
    <div class="loading-box">
        <div class="loader"></div>
        <div id="loading-text" style="color:var(--text-sub);font-size:14px;">Please wait...</div>
    </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- AUTH CONTAINER -->
<div class="auth-container" id="auth-container" style="display:none;">
    <div class="logo-area">
        <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
        <div class="logo-text">Duty Tracker Pro</div>
        <div class="logo-sub">Track your duty. Own your time.</div>
    </div>

    <!-- MAIN AUTH CARD -->
    <div class="auth-card" id="main-auth">
        <div class="tab-row">
            <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- LOGIN FORM -->
        <div class="form-section active" id="form-login">
            <div class="inp-wrap">
                <i class="fas fa-envelope inp-icon"></i>
                <input type="email" id="login-email" class="inp" placeholder="Email address" autocomplete="email">
            </div>
            <div class="inp-wrap">
                <i class="fas fa-lock inp-icon"></i>
                <input type="password" id="login-pass" class="inp" placeholder="Password" autocomplete="current-password">
                <button class="eye-btn" onclick="toggleEye('login-pass',this)"><i class="fas fa-eye-slash"></i></button>
            </div>
            <div class="forgot-link"><a href="#" onclick="showForgot()">Forgot Password?</a></div>
            <button class="btn btn-primary" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> Login</button>
            <div class="divider"><div class="divider-line"></div><span>OR</span><div class="divider-line"></div></div>
            <button class="btn btn-google" onclick="doGoogleLogin()">
                <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
            </button>
        </div>

        <!-- SIGNUP FORM -->
        <div class="form-section" id="form-signup">
            <div class="inp-wrap">
                <i class="fas fa-user inp-icon"></i>
                <input type="text" id="signup-name" class="inp" placeholder="Full Name" autocomplete="name">
            </div>
            <div class="inp-wrap">
                <i class="fas fa-envelope inp-icon"></i>
                <input type="email" id="signup-email" class="inp" placeholder="Email address" autocomplete="email">
            </div>
            <div class="inp-wrap">
                <i class="fas fa-lock inp-icon"></i>
                <input type="password" id="signup-pass" class="inp" placeholder="Password (min 6 chars)" oninput="checkStrength(this.value)" autocomplete="new-password">
                <button class="eye-btn" onclick="toggleEye('signup-pass',this)"><i class="fas fa-eye-slash"></i></button>
            </div>
            <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
            <div class="inp-wrap">
                <i class="fas fa-lock inp-icon"></i>
                <input type="password" id="signup-pass2" class="inp" placeholder="Confirm Password" autocomplete="new-password">
                <button class="eye-btn" onclick="toggleEye('signup-pass2',this)"><i class="fas fa-eye-slash"></i></button>
            </div>
            <button class="btn btn-primary" onclick="doSignup()"><i class="fas fa-user-plus"></i> Create Account</button>
            <div class="divider"><div class="divider-line"></div><span>OR</span><div class="divider-line"></div></div>
            <button class="btn btn-google" onclick="doGoogleLogin()">
                <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
            </button>
            <p class="terms-text">By signing up, you agree to our <a href="#">Terms</a> & <a href="#">Privacy Policy</a></p>
        </div>
    </div>

    <!-- FORGOT PASSWORD PANEL -->
    <div class="auth-card" id="forgot-panel" style="display:none;">
        <button class="back-btn" onclick="hideForgot()"><i class="fas fa-arrow-left"></i> Back to Login</button>
        <div style="text-align:center;margin-bottom:20px;">
            <i class="fas fa-key" style="font-size:40px;color:var(--primary);"></i>
            <h3 style="margin-top:10px;">Reset Password</h3>
            <p style="font-size:13px;color:var(--text-sub);margin-top:5px;">Enter your email and we'll send a reset link</p>
        </div>
        <div class="inp-wrap">
            <i class="fas fa-envelope inp-icon"></i>
            <input type="email" id="forgot-email" class="inp" placeholder="Your email address">
        </div>
        <button class="btn btn-primary" onclick="doForgot()"><i class="fas fa-paper-plane"></i> Send Reset Link</button>
    </div>

    <div class="made-in">Made with ❤️ by Nitai Studio 🇮🇳</div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCE0l5l-hH330jvC989Dr99r7M5v3wMgPo",
        authDomain: "duty-tracker-pro-329c4.firebaseapp.com",
        projectId: "duty-tracker-pro-329c4",
        storageBucket: "duty-tracker-pro-329c4.firebasestorage.app",
        messagingSenderId: "51179753980",
        appId: "1:51179753980:web:78cfda910b7fa6954fa279"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // Check if already logged in
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            showLoading("Signing you in...");
            await ensureUserDoc(user);
            // Save uid to localStorage for other sections
            localStorage.setItem("dtp_uid", user.uid);
            localStorage.setItem("dtp_name", user.displayName || user.email.split("@")[0]);
            localStorage.setItem("dtp_email", user.email);
            localStorage.setItem("dtp_photo", user.photoURL || "");
            // Navigate to Home (S2) using AppCreator24 navigation
            goToSection("S2");
        } else {
            hideSplash();
        }
    });

    async function ensureUserDoc(user) {
        const ref = doc(db, "users", user.uid);
        const snap = await getDoc(ref);
        if (!snap.exists()) {
            await setDoc(ref, {
                name: user.displayName || user.email.split("@")[0],
                email: user.email,
                avatar: user.photoURL || "",
                createdAt: new Date().toISOString(),
                settings: { cur: "₹", sal: 500, food: 50, otr: 100, pf: 0, target: 15000 }
            });
        }
    }

    function hideSplash() {
        const s = document.getElementById("splash");
        s.style.opacity = "0";
        setTimeout(() => { s.style.display = "none"; document.getElementById("auth-container").style.display = "block"; }, 800);
    }

    function showLoading(msg) {
        document.getElementById("loading-text").innerText = msg || "Please wait...";
        document.getElementById("loading").style.display = "flex";
    }
    function hideLoading() { document.getElementById("loading").style.display = "none"; }

    // LOGIN
    window.doLogin = async function() {
        const email = document.getElementById("login-email").value.trim();
        const pass = document.getElementById("login-pass").value;
        if (!email || !pass) { showToast("Please fill all fields", "error"); return; }
        showLoading("Logging in...");
        try {
            await signInWithEmailAndPassword(auth, email, pass);
            showToast("Welcome back! ✅", "success");
        } catch(e) {
            hideLoading();
            showToast(getFBError(e.code), "error");
        }
    };

    // SIGNUP
    window.doSignup = async function() {
        const name = document.getElementById("signup-name").value.trim();
        const email = document.getElementById("signup-email").value.trim();
        const pass = document.getElementById("signup-pass").value;
        const pass2 = document.getElementById("signup-pass2").value;
        if (!name || !email || !pass) { showToast("Please fill all fields", "error"); return; }
        if (pass !== pass2) { showToast("Passwords don't match ❌", "error"); return; }
        if (pass.length < 6) { showToast("Password must be 6+ characters", "error"); return; }
        showLoading("Creating account...");
        try {
            const cred = await createUserWithEmailAndPassword(auth, email, pass);
            await updateProfile(cred.user, { displayName: name });
            showToast("Account created! 🎉", "success");
        } catch(e) {
            hideLoading();
            showToast(getFBError(e.code), "error");
        }
    };

    // GOOGLE LOGIN
    window.doGoogleLogin = async function() {
        showLoading("Opening Google...");
        try {
            await signInWithPopup(auth, googleProvider);
            showToast("Google login successful! ✅", "success");
        } catch(e) {
            hideLoading();
            if (e.code !== "auth/popup-closed-by-user") showToast(getFBError(e.code), "error");
        }
    };

    // FORGOT PASSWORD
    window.doForgot = async function() {
        const email = document.getElementById("forgot-email").value.trim();
        if (!email) { showToast("Enter your email", "error"); return; }
        showLoading("Sending reset link...");
        try {
            await sendPasswordResetEmail(auth, email);
            hideLoading();
            showToast("Reset link sent! Check your inbox 📧", "success");
            hideForgot();
        } catch(e) {
            hideLoading();
            showToast(getFBError(e.code), "error");
        }
    };

    function getFBError(code) {
        const msgs = {
            "auth/user-not-found": "No account found with this email",
            "auth/wrong-password": "Incorrect password",
            "auth/email-already-in-use": "Email already registered",
            "auth/invalid-email": "Invalid email address",
            "auth/too-many-requests": "Too many attempts. Try later",
            "auth/network-request-failed": "No internet connection",
            "auth/weak-password": "Password is too weak",
            "auth/invalid-credential": "Invalid email or password"
        };
        return msgs[code] || "Something went wrong. Try again.";
    }

    // AppCreator24 navigation
        function goToSection(ref) {
        var a = document.getElementById("nav-" + ref);
        if (a) { a.click(); }
        else {
            var t = document.createElement("a");
            t.href = "go:" + ref;
            t.style.display = "none";
            document.body.appendChild(t);
            t.click();
            document.body.removeChild(t);
        }
    }else{var _t=document.createElement("a");_t.href="go:"+ref;_t.style.display="none";document.body.appendChild(_t);_t.click();document.body.removeChild(_t);}
    }

    setTimeout(() => {
        if (document.getElementById("splash").style.display !== "none") hideSplash();
    }, 3000);
</script>

<script>
    function switchTab(tab) {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".form-section").forEach(f => f.classList.remove("active"));
        document.getElementById("tab-" + tab).classList.add("active");
        document.getElementById("form-" + tab).classList.add("active");
    }

    function toggleEye(id, btn) {
        const inp = document.getElementById(id);
        const icon = btn.querySelector("i");
        if (inp.type === "password") {
            inp.type = "text";
            icon.className = "fas fa-eye";
        } else {
            inp.type = "password";
            icon.className = "fas fa-eye-slash";
        }
    }

    function checkStrength(val) {
        const fill = document.getElementById("strength-fill");
        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 10) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        const colors = ["#ef233c","#ff9f1c","#ffd166","#06d6a0","#4361ee"];
        const widths = ["20%","40%","60%","80%","100%"];
        fill.style.width = widths[score-1] || "0%";
        fill.style.background = colors[score-1] || "transparent";
    }

    function showForgot() {
        document.getElementById("main-auth").style.display = "none";
        document.getElementById("forgot-panel").style.display = "block";
    }
    function hideForgot() {
        document.getElementById("forgot-panel").style.display = "none";
        document.getElementById("main-auth").style.display = "block";
    }

    function showToast(msg, type) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.className = "show " + (type || "");
        setTimeout(() => t.className = "", 3500);
    }

    // Enter key support
    document.addEventListener("keydown", e => {
        if (e.key === "Enter") {
            const tab = document.querySelector(".tab-btn.active")?.id;
            if (tab === "tab-login") window.doLogin?.();
            else if (tab === "tab-signup") window.doSignup?.();
        }
    });
</script>

<!-- AppCreator24 Navigation Anchors -->
<a id="nav-S1" href="go:S1" style="display:none"></a>
<a id="nav-S2" href="go:S2" style="display:none"></a>
<a id="nav-S3" href="go:S3" style="display:none"></a>
<a id="nav-S4" href="go:S4" style="display:none"></a>
<a id="nav-S5" href="go:S5" style="display:none"></a>
<a id="nav-S6" href="go:S6" style="display:none"></a>
<a id="nav-S7" href="go:S7" style="display:none"></a>
<a id="nav-S8" href="go:S8" style="display:none"></a>

</body>
</html>
