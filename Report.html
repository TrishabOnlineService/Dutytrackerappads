<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reports - Duty Tracker Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#060608;--card:#141418;--card2:#1c1c22;--text:#fff;--sub:#888;--primary:#4361ee;--pl:#6c8cff;--sec:#4cc9f0;--grad:linear-gradient(135deg,#4361ee,#4cc9f0);--danger:#ef233c;--success:#06d6a0;--warn:#ff9f1c;--border:rgba(255,255,255,0.08);--inp:#1e1e26;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:30px;}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}

.topbar{padding:14px 18px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;}
.back{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;display:flex;align-items:center;}
.pg-title{font-size:20px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.content{padding:14px;animation:up 0.3s;}

.card{background:var(--card);border-radius:20px;padding:18px;border:1px solid var(--border);margin-bottom:14px;}
.card-title{font-weight:800;font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{background:var(--inp);border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--sub);transition:0.2s;flex-shrink:0;}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(67,97,238,0.3);}

.lbl{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:5px;display:block;margin-top:12px;text-transform:uppercase;letter-spacing:0.4px;}
.lbl:first-of-type{margin-top:0;}
.inp-wrap{position:relative;}
.inp-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:13px;pointer-events:none;}
input[type=date]{width:100%;padding:13px 13px 13px 36px;background:var(--inp);border:1.5px solid var(--border);color:#fff;border-radius:13px;outline:none;font-size:14px;font-family:'Outfit',sans-serif;transition:0.2s;}
input[type=date]:focus{border-color:var(--primary);}

.btn{width:100%;padding:15px;border:none;border-radius:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;font-size:14px;font-family:'Outfit',sans-serif;margin-top:12px;transition:0.2s;}
.btn:active{transform:scale(0.97);}
.btn-g{background:var(--grad);color:#fff;box-shadow:0 6px 20px rgba(67,97,238,0.3);}
.btn-pdf{background:rgba(239,35,60,0.12);color:#ff6b6b;border:1px solid rgba(239,35,60,0.3);}
.btn-wa{background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;}
.btn-fb{background:linear-gradient(135deg,#1877f2,#0c5cbf);color:#fff;}
.btn-dl{background:rgba(255,255,255,0.06);color:var(--text);border:1px solid var(--border);}
.res-card{background:var(--card);border-radius:22px;border:1px solid var(--border);overflow:hidden;margin-top:14px;animation:up 0.35s;}
.res-head{background:linear-gradient(135deg,#1a1f6e,#0f3460);padding:22px 20px;text-align:center;position:relative;overflow:hidden;}
.res-period{color:rgba(255,255,255,0.55);font-size:11px;font-weight:700;letter-spacing:0.4px;margin-bottom:4px;}
.res-name{color:rgba(255,255,255,0.7);font-size:13px;margin-bottom:6px;}
.res-net-lbl{color:rgba(255,255,255,0.55);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
.res-net{color:#fff;font-size:42px;font-weight:800;line-height:1.1;margin-top:2px;}
.stat-pills{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--border);}
.pill{flex:1;min-width:80px;background:var(--card2);border-radius:12px;padding:10px 8px;text-align:center;border:1px solid var(--border);}
.pill-val{font-size:18px;font-weight:800;}
.pill-lbl{font-size:9px;color:var(--sub);font-weight:700;margin-top:2px;text-transform:uppercase;}
.section-lbl{padding:12px 18px 6px;font-size:10px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:0.7px;}
.res-row{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid rgba(255,255,255,0.04);}
.res-row:last-child{border-bottom:none;}
.row-left{display:flex;align-items:center;gap:10px;}
.row-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.res-lbl{font-size:13px;color:var(--sub);}
.res-val{font-size:15px;font-weight:800;}
.g{color:var(--success);} .r{color:var(--danger);} .o{color:var(--warn);} .b{color:var(--pl);}
.share-section{padding:16px;display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--border);}
.share-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;}

/* PDF Modal */
#pdf-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:10000;display:none;flex-direction:column;}
#pdf-modal.on{display:flex;}
.pdf-modal-header{background:var(--card);padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);}
.pdf-modal-header .title{flex:1;font-weight:800;font-size:16px;}
.pdf-modal-header .close{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;}
#pdf-viewer{flex:1;width:100%;border:none;background:#fff;}
.pdf-modal-footer{background:var(--card);padding:14px;display:flex;gap:10px;border-top:1px solid var(--border);}
.pdf-modal-footer .btn{margin:0;flex:1;}

.loader{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.95);padding:25px 35px;border-radius:20px;z-index:20000;text-align:center;border:1px solid var(--border);}
.loader.on{display:block;}
.loader i{font-size:35px;color:var(--primary);animation:spin 1s linear infinite;}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.loader-text{margin-top:12px;font-size:13px;color:var(--sub);}

#toast{visibility:hidden;background:#1a1a22;color:#fff;border:1px solid var(--border);border-radius:50px;padding:12px 22px;position:fixed;z-index:99999;left:50%;bottom:24px;transform:translateX(-50%);font-size:13px;font-weight:600;opacity:0;transition:opacity 0.3s,bottom 0.3s;white-space:nowrap;}
#toast.on{visibility:visible;opacity:1;bottom:40px;}
a.na{display:none!important;}
</style>
</head>
<body>

<div id="pdf-modal">
  <div class="pdf-modal-header">
    <div class="title"><i class="fas fa-file-pdf"></i> Salary Report</div>
    <button class="close" onclick="closePDFModal()"><i class="fas fa-times"></i></button>
  </div>
  <iframe id="pdf-viewer" src="about:blank"></iframe>
  <div class="pdf-modal-footer">
    <button class="btn btn-wa" onclick="shareWAReport()"><i class="fab fa-whatsapp"></i> WhatsApp</button>
    <button class="btn btn-dl" onclick="downloadPDFSafe()"><i class="fas fa-download"></i> Download</button>
  </div>
</div>

<div id="loader" class="loader">
  <i class="fas fa-spinner"></i>
  <div class="loader-text">Generating PDF Report...</div>
</div>

<div id="toast"></div>

<div class="topbar">
  <button class="back" onclick="goTo('S2')"><i class="fas fa-arrow-left"></i></button>
  <div class="pg-title">📊 Reports</div>
</div>

<div class="content">
  <div class="card">
    <div class="card-title">🗓️ Select Period</div>
    <div class="chips" id="chips"></div>
    <span class="lbl">Start Date</span>
    <div class="inp-wrap"><i class="fas fa-calendar"></i><input type="date" id="r-s"></div>
    <span class="lbl">End Date</span>
    <div class="inp-wrap"><i class="fas fa-calendar-check"></i><input type="date" id="r-e"></div>
    <button class="btn btn-g" onclick="genReport()"><i class="fas fa-calculator"></i> Generate Report</button>
  </div>
  <div id="out"></div>
</div>

<a class="na" id="nav-S1" href="go:S1"></a><a class="na" id="nav-S2" href="go:S2"></a>
<a class="na" id="nav-S3" href="go:S3"></a><a class="na" id="nav-S4" href="go:S4"></a>
<a class="na" id="nav-S5" href="go:S5"></a><a class="na" id="nav-S6" href="go:S6"></a>
<a class="na" id="nav-S7" href="go:S7"></a><a class="na" id="nav-S8" href="go:S8"></a>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// Firebase Config
var FB_CFG = {
  apiKey: "AIzaSyCE0l5l-hH330jvC989Dr99r7M5v3wMgPo",
  authDomain: "duty-tracker-pro-329c4.firebaseapp.com",
  databaseURL: "https://duty-tracker-pro-329c4-default-rtdb.firebaseio.com",
  projectId: "duty-tracker-pro-329c4",
  storageBucket: "duty-tracker-pro-329c4.firebasestorage.app",
  messagingSenderId: "51179753980",
  appId: "1:51179753980:web:78cfda910b7fa6954fa279"
};

if(!firebase.apps.length) firebase.initializeApp(FB_CFG);
var DB = firebase.database();
var UID = localStorage.getItem("dtp_uid");
if(!UID) goTo("S1");

var ATT = {};
var S = {cur:"₹", sal:500, food:50, otr:100, pf:0, target:15000};
var UNAME = "User";
var currentReportData = null;

DB.ref("users/"+UID).once("value", function(snap){
  if(!snap.exists()){ goTo("S1"); return; }
  var d = snap.val();
  if(d.attendance) ATT = d.attendance;
  if(d.settings) S = Object.assign(S, d.settings);
  UNAME = d.name || "User";
  initDates();
  buildChips();
});

function initDates(){
  var now = new Date();
  document.getElementById("r-e").value = now.toISOString().split("T")[0];
  document.getElementById("r-s").value = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split("T")[0];
}

function buildChips(){
  var now = new Date();
  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var h = "";
  for(var i=0;i<6;i++){
    var d2 = new Date(now.getFullYear(), now.getMonth()-i, 1);
    var y = d2.getFullYear(), m = d2.getMonth();
    h += '<div class="chip'+(i===0?" on":"")+'" onclick="selMon('+y+','+m+',this)">'+months[m]+" '"+String(y).slice(2)+'</div>';
  }
  document.getElementById("chips").innerHTML = h;
}

function selMon(y,m,el){
  document.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("on"); });
  el.classList.add("on");
  document.getElementById("r-s").value = new Date(y,m,1).toISOString().split("T")[0];
  document.getElementById("r-e").value = new Date(y,m+1,0).toISOString().split("T")[0];
}

function genReport(){
  var sVal = document.getElementById("r-s").value;
  var eVal = document.getElementById("r-e").value;
  if(!sVal||!eVal){ toast("⚠️ Select dates"); return; }
  
  var start = new Date(sVal+"T00:00:00");
  var end = new Date(eVal+"T23:59:59");
  
  var counts = {Present:0,"Half Day":0,Leave:0,Sick:0,Holiday:0,Off:0};
  var totalOT = 0, totalLate = 0;
  var salEarn = 0, foodEarn = 0, otPay = 0;
  
  Object.keys(ATT).sort().forEach(function(date){
    var d = new Date(date+"T00:00:00");
    if(d >= start && d <= end){
      var e = ATT[date];
      var type = e.type;
      if(counts[type] !== undefined) counts[type]++;
      if(type === "Present"){ salEarn += S.sal; foodEarn += (S.food||0); }
      else if(type === "Half Day"){ salEarn += S.sal/2; foodEarn += (S.food||0)/2; }
      else if(type === "Holiday" || type === "Sick"){ salEarn += S.sal; }
      if(e.ot && parseFloat(e.ot) > 0){ var ot = parseFloat(e.ot); totalOT += ot; otPay += ot * (S.otr||100); }
      if(e.late && parseFloat(e.late) > 0) totalLate += parseFloat(e.late);
    }
  });
  
  var gross = salEarn + foodEarn + otPay;
  var pfAmt = parseFloat(S.pf) || 0;
  var net = Math.max(0, gross - pfAmt);
  var totalWorked = counts.Present + (counts["Half Day"]*0.5) + counts.Holiday + counts.Sick;
  
  currentReportData = {
    net: net, salEarn: salEarn, foodEarn: foodEarn, otPay: otPay, pfAmt: pfAmt, gross: gross,
    totalOT: totalOT, totalLate: totalLate, counts: counts, totalWorked: totalWorked,
    cur: S.cur || "₹", start: sVal, end: eVal, name: UNAME
  };
  
  renderResult(currentReportData);
}

function renderResult(r){
  var c = r.cur;
  var fmt = function(n){ return c+Math.round(n).toLocaleString(); };
  
  var html = '<div class="res-card" style="animation:pop 0.3s ease;">';
  html += '<div class="res-head">';
  html += '<div class="res-period">Period: '+r.start+' → '+r.end+'</div>';
  html += '<div class="res-name">👤 '+r.name+'</div>';
  html += '<div class="res-net-lbl">NET PAYABLE</div>';
  html += '<div class="res-net">'+fmt(r.net)+'</div>';
  html += '</div>';
  
  html += '<div class="stat-pills">';
  var pillDefs = [
    {icon:"✅", val:r.counts.Present, lbl:"PRESENT", col:"#06d6a0"},
    {icon:"🌗", val:r.counts["Half Day"], lbl:"HALF DAY", col:"#6c8cff"},
    {icon:"🏠", val:r.counts.Leave, lbl:"LEAVE", col:"#ef233c"},
    {icon:"🤒", val:r.counts.Sick, lbl:"SICK", col:"#ff9f1c"},
    {icon:"🎉", val:r.counts.Holiday, lbl:"HOLIDAY", col:"#9d4edd"},
    {icon:"😴", val:r.counts.Off, lbl:"OFF", col:"#666"}
  ];
  pillDefs.forEach(function(p){
    html += '<div class="pill"><div class="pill-val" style="color:'+p.col+'">'+p.icon+' '+p.val+'</div><div class="pill-lbl">'+p.lbl+'</div></div>';
  });
  html += '</div>';
  
  html += '<div class="stat-pills" style="border-top:1px solid var(--border);padding-top:10px;">';
  html += '<div class="pill"><div class="pill-val" style="color:#4cc9f0">⏰ '+r.totalOT+'h</div><div class="pill-lbl">OT HOURS</div></div>';
  html += '<div class="pill"><div class="pill-val" style="color:#ff9f1c">⏱️ '+Math.round(r.totalLate)+'m</div><div class="pill-lbl">LATE MINS</div></div>';
  html += '<div class="pill"><div class="pill-val" style="color:#06d6a0">📅 '+r.totalWorked+'</div><div class="pill-lbl">DAYS WORKED</div></div>';
  html += '</div>';
  
  html += '<div class="section-lbl">EARNINGS</div>';
  var rows = [
    {icon:"💰", bg:"rgba(6,214,160,0.1)", lbl:"Base Salary", val:fmt(r.salEarn), cls:"g"},
    {icon:"🍱", bg:"rgba(76,201,240,0.1)", lbl:"Food Allowance", val:fmt(r.foodEarn), cls:"t"},
    {icon:"⏰", bg:"rgba(255,159,28,0.1)", lbl:"OT Pay ("+r.totalOT+"h)", val:fmt(r.otPay), cls:"o"},
    {icon:"💼", bg:"rgba(108,140,255,0.1)", lbl:"Gross", val:fmt(r.gross), cls:"b"},
    {icon:"📉", bg:"rgba(239,35,60,0.1)", lbl:"PF Deduction", val:"-"+fmt(r.pfAmt), cls:"r"},
    {icon:"🏆", bg:"rgba(6,214,160,0.15)", lbl:"Net Take-Home", val:fmt(r.net), cls:"g"}
  ];
  rows.forEach(function(row){
    html += '<div class="res-row"><div class="row-left"><div class="row-icon" style="background:'+row.bg+'">'+row.icon+'</div><div class="res-lbl">'+row.lbl+'</div></div><div class="res-val '+row.cls+'">'+row.val+'</div></div>';
  });
  
  html += '<div class="share-section">';
  html += '<button class="btn btn-pdf" onclick="viewPDFInApp()" style="margin-top:0;"><i class="fas fa-file-pdf"></i> View PDF Report</button>';
  html += '<div class="share-row">';
  html += '<button class="btn btn-wa" onclick="shareWAReport()" style="margin-top:0;"><i class="fab fa-whatsapp"></i> WhatsApp</button>';
  html += '<button class="btn btn-fb" onclick="shareFBReport()" style="margin-top:0;"><i class="fab fa-facebook"></i> Facebook</button>';
  html += '</div>';
  html += '<button class="btn btn-dl" onclick="downloadPDFSafe()" style="margin-top:0;"><i class="fas fa-download"></i> Download PDF</button>';
  html += '</div>';
  html += '</div>';
  
  document.getElementById("out").innerHTML = html;
  document.getElementById("out").scrollIntoView({behavior:"smooth",block:"start"});
}

// ============ CRASH-FREE PDF FUNCTIONS ============

function showLoader(show, msg){
  var loader = document.getElementById('loader');
  if(show) {
    document.querySelector('.loader-text').innerText = msg || 'Generating PDF Report...';
    loader.classList.add('on');
  } else {
    loader.classList.remove('on');
  }
}

async function generatePDFBlob() {
  if(!currentReportData) return null;
  
  return new Promise(async (resolve) => {
    try {
      showLoader(true, 'Creating report layout...');
      
      var pdfDiv = document.createElement('div');
      pdfDiv.style.position = 'absolute';
      pdfDiv.style.left = '-9999px';
      pdfDiv.style.top = '-9999px';
      pdfDiv.style.width = '800px';
      pdfDiv.style.backgroundColor = '#ffffff';
      pdfDiv.style.padding = '20px';
      pdfDiv.style.fontFamily = 'Outfit, sans-serif';
      document.body.appendChild(pdfDiv);
      
      var r = currentReportData;
      var c = r.cur;
      var fmt = function(n){ return c+Math.round(n).toLocaleString(); };
      
      pdfDiv.innerHTML = `
        <div style="text-align:center; padding:20px; background:linear-gradient(135deg,#1a1f6e,#0f3460); color:white; border-radius:12px;">
          <h2 style="margin:0;">Duty Tracker Pro</h2>
          <p style="margin:5px 0;">Employee: ${r.name}</p>
          <p style="margin:5px 0;">Period: ${r.start} → ${r.end}</p>
        </div>
        <div style="text-align:center; padding:15px; background:#101b50; color:white; margin:15px 0; border-radius:8px;">
          <small>NET PAYABLE</small>
          <h1 style="margin:5px 0; font-size:32px;">${fmt(r.net)}</h1>
        </div>
        <h3 style="color:#4361ee;">📊 Attendance Summary</h3>
        <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
          <tr style="background:#4361ee; color:white;"><th style="padding:8px;">Type</th><th style="padding:8px;">Count</th></tr>
          <tr><td style="padding:6px; border-bottom:1px solid #ddd;">Present</td><td style="padding:6px; border-bottom:1px solid #ddd;">${r.counts.Present}</td></tr>
          <tr><td style="padding:6px; border-bottom:1px solid #ddd;">Half Day</td><td style="padding:6px; border-bottom:1px solid #ddd;">${r.counts["Half Day"]}</td></tr>
          <tr><td style="padding:6px; border-bottom:1px solid #ddd;">Leave</td><td style="padding:6px; border-bottom:1px solid #ddd;">${r.counts.Leave}</td></tr>
          <tr><td style="padding:6px; border-bottom:1px solid #ddd;">Sick</td><td style="padding:6px; border-bottom:1px solid #ddd;">${r.counts.Sick}</td></tr>
          <tr><td style="padding:6px; border-bottom:1px solid #ddd;">Holiday</td><td style="padding:6px; border-bottom:1px solid #ddd;">${r.counts.Holiday}</td></tr>
          <tr><td style="padding:6px; border-bottom:1px solid #ddd;">Off</td><td style="padding:6px; border-bottom:1px solid #ddd;">${r.counts.Off}</td></tr>
          <tr style="background:#f0f0f0;"><td style="padding:6px;"><strong>OT Hours</strong></td><td style="padding:6px;"><strong>${r.totalOT}h</strong></td></tr>
          <tr style="background:#f0f0f0;"><td style="padding:6px;"><strong>Late Minutes</strong></td><td style="padding:6px;"><strong>${Math.round(r.totalLate)}m</strong></td></tr>
        </table>
        <h3 style="color:#10b981;">💰 Salary Breakdown</h3>
        <table style="width:100%; border-collapse:collapse;">
          <tr style="background:#10b981; color:white;"><th style="padding:8px;">Component</th><th style="padding:8px;">Amount</th></tr>
          <tr><td style="padding:6px; border-bottom:1px solid #ddd;">Base Salary</td><td style="padding:6px; border-bottom:1px solid #ddd;">${fmt(r.salEarn)}</td></tr>
          <tr><td style="padding:6px; border-bottom:1px solid #ddd;">Food Allowance</td><td style="padding:6px; border-bottom:1px solid #ddd;">${fmt(r.foodEarn)}</td></tr>
          <tr><td style="padding:6px; border-bottom:1px solid #ddd;">OT Pay</td><td style="padding:6px; border-bottom:1px solid #ddd;">${fmt(r.otPay)}</td></tr>
          <tr><td style="padding:6px; border-bottom:1px solid #ddd;"><strong>Gross</strong></td><td style="padding:6px; border-bottom:1px solid #ddd;"><strong>${fmt(r.gross)}</strong></td></tr>
          <tr><td style="padding:6px; border-bottom:1px solid #ddd;">PF Deduction</td><td style="padding:6px; border-bottom:1px solid #ddd; color:red;">-${fmt(r.pfAmt)}</td></tr>
          <tr style="background:#e8f5e9;"><td style="padding:8px;"><strong>NET TAKE-HOME</strong></td><td style="padding:8px;"><strong style="color:#06d6a0; font-size:18px;">${fmt(r.net)}</strong></td></tr>
        </table>
        <div style="text-align:center; margin-top:30px; padding-top:15px; border-top:1px solid #ddd; color:#888; font-size:10px;">
          Generated by Duty Tracker Pro | Nitai Studio 🇮🇳<br>${new Date().toLocaleString()}
        </div>
      `;
      
      showLoader(true, 'Rendering PDF...');
      var canvas = await html2canvas(pdfDiv, {
        scale: 2,
        backgroundColor: '#ffffff',
        logging: false,
        useCORS: true
      });
      
      document.body.removeChild(pdfDiv);
      
      var imgData = canvas.toDataURL('image/jpeg', 0.95);
      var { jsPDF } = window.jspdf;
      var doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      var imgWidth = 210;
      var imgHeight = (canvas.height * imgWidth) / canvas.width;
      doc.addImage(imgData, 'JPEG', 0, 0, imgWidth, imgHeight);
      
      var blob = doc.output('blob');
      showLoader(false);
      resolve(blob);
    } catch(e) {
      console.error("PDF Error:", e);
      showLoader(false);
      toast("❌ PDF Error: " + e.message);
      resolve(null);
    }
  });
}

// View PDF inside App (No crash)
async function viewPDFInApp() {
  if(!currentReportData) { toast("⚠️ Generate report first"); return; }
  toast("⏳ Generating PDF...");
  var blob = await generatePDFBlob();
  if(!blob) return;
  
  var url = URL.createObjectURL(blob);
  var viewer = document.getElementById('pdf-viewer');
  viewer.src = url;
  document.getElementById('pdf-modal').classList.add('on');
}

// SAFE DOWNLOAD - No crash in AppCreator24
async function downloadPDFSafe() {
  if(!currentReportData) { toast("⚠️ Generate report first"); return; }
  
  toast("⏳ Preparing PDF...");
  var blob = await generatePDFBlob();
  if(!blob) return;
  
  var url = URL.createObjectURL(blob);
  var filename = 'Duty_Report_' + UNAME.replace(/\s/g,'_') + '_' + Date.now() + '.pdf';
  
  // Method 1: Try using <a> tag download (works in browsers)
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  
  // Cleanup
  setTimeout(function() {
    URL.revokeObjectURL(url);
  }, 5000);
  
  toast("✅ Download started! Check your Downloads folder.");
}

function closePDFModal() {
  var modal = document.getElementById('pdf-modal');
  var viewer = document.getElementById('pdf-viewer');
  if(viewer.src && viewer.src !== 'about:blank') {
    try { URL.revokeObjectURL(viewer.src); } catch(e) {}
  }
  viewer.src = 'about:blank';
  modal.classList.remove('on');
}

    "👤 *Employee:* " + r.name + "\n" +
